<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمر زياد | طالب حاسبات</title>
<meta name="description" content="Omar Zeyad | عمر زياد - Computer science student. موقع تعريفي لطالب حاسبات.">
<meta name="theme-color" content="#EAF0F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{--bg:#EAF0F6;--card:#fff;--ink:#0F1B33;--mute:#56647D;--blue:#1F4BFF;--sun:#FFE066;--line:#CFD9E6}
[data-theme="dark"]{--bg:#0B132B;--card:#162038;--ink:#F1F5F9;--mute:#94A3B8;--blue:#3B82F6;--sun:#FFD166;--line:#22304E}
[data-theme="dark"] .code{background:#070C1B;border:1px solid var(--line)}
[data-theme="dark"] .contact{background:#080E1E;border:1.5px solid var(--line)}
[data-theme="dark"] .card.empty{border-color:var(--line)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px;overflow-x:hidden;transition:background .25s ease,color .25s ease}
h1,h2,h3{font-family:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.3}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;gap:12px}
.logo{font-family:'Readex Pro',sans-serif;font-weight:700;font-size:1.1rem;text-decoration:none}
.hd{display:flex;gap:10px;align-items:center}
.theme-btn{background:transparent;border:2px solid var(--ink);border-radius:50%;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;font-size:1rem;color:var(--ink);transition:transform .2s,border-color .2s}
.theme-btn:hover{transform:rotate(18deg) scale(1.05);border-color:var(--blue)}
.lang{font:600 .95rem 'Readex Pro',sans-serif;background:transparent;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer;transition:background .15s,color .15s}
.lang:hover{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:14px 26px;border-radius:999px;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 24px rgba(31,75,255,.35)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.small{padding:8px 18px;font-size:.95rem}
.hero-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);background:var(--card);box-shadow:0 6px 18px rgba(31,75,255,.15);color:var(--blue)}
.btn.ghost svg{fill:currentColor;stroke:none}
.interests-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:20px}
.interest-card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px;transition:transform .2s,border-color .2s,box-shadow .2s}
.interest-card:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:6px 6px 0 var(--blue)}
.interest-card .icon{font-size:1.9rem;display:inline-block;margin-bottom:8px}
.interest-card h3{font-size:1.15rem;margin-bottom:6px}
.interest-card p{color:var(--mute);font-size:.92rem;line-height:1.6}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tag-tech{font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:6px;background:rgba(31,75,255,.1);color:var(--blue)}
[data-theme="dark"] .tag-tech{background:rgba(59,130,246,.2);color:#93C5FD}
.contact-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.contact-actions .btn{padding:12px 22px;font-size:.95rem}
.contact-actions .btn.light{background:#fff;color:#0F1B33}
.contact-actions .btn.ghost-white{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.25)}
.contact-actions .btn.ghost-white:hover{background:#fff;color:#0F1B33;border-color:#fff}
.contact-actions .btn.ghost-white svg{fill:currentColor;stroke:none}
.contact-actions .btn svg.stroke-only{fill:none;stroke:currentColor}
.hero{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;padding:40px 0 90px;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:32px 32px}}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.hi{font-family:'Readex Pro',sans-serif;font-weight:500;font-size:1.2rem;color:var(--mute);margin-bottom:6px}
h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:700;margin-bottom:20px;letter-spacing:-.01em}
.lead{color:var(--mute);max-width:32em;margin-bottom:30px;font-size:1.1rem}
.pic{position:relative;max-width:440px;width:100%}
.pic::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--sun);inset-inline-start:-34px;bottom:-34px;z-index:0}
.frame{position:relative;z-index:1;aspect-ratio:1/1;border-radius:26px;box-shadow:14px 14px 0 var(--blue);background:var(--card)}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:26px;display:block}
.sticker{position:absolute;top:-16px;inset-inline-start:-12px;background:var(--ink);color:#fff;font-weight:600;padding:8px 18px;border-radius:10px;transform:rotate(-4deg);font-size:.95rem;animation:wob 4s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(3deg) translateY(-3px)}}
.code{position:absolute;z-index:2;bottom:-30px;inset-inline-end:-18px;direction:ltr;text-align:left;background:var(--ink);color:#DDE6FF;border-radius:14px;padding:14px 18px;font:500 .82rem/1.6 ui-monospace,Menlo,Consolas,monospace;min-width:210px;min-height:112px;box-shadow:0 14px 30px rgba(15,27,51,.3)}
.code pre{font:inherit;white-space:pre}
.code .s{color:var(--sun)}
.code .c::after{content:"";display:inline-block;width:7px;height:1em;background:var(--sun);vertical-align:-2px;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.js .ld{opacity:0;transform:translateY(24px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.12s)}
@keyframes up{to{opacity:1;transform:none}}
.band{background:var(--blue);color:#fff;overflow:hidden;white-space:nowrap;direction:ltr;transform:rotate(-1.2deg);margin:-30px -10px 0;padding:14px 0;position:relative;z-index:3}
.band div{display:inline-block;animation:mq 26s linear infinite;font:700 1.25rem 'Readex Pro',sans-serif}
.band span{margin:0 22px}
@keyframes mq{to{transform:translateX(-50%)}}
section{padding:72px 0}
h2{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:30px}
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}
.about img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 25%;border-radius:22px;display:block;box-shadow:-12px 12px 0 var(--sun)}
.about p+p{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:500;transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--blue)}
.tag{font-size:.82rem;font-weight:600;padding:2px 10px;border-radius:999px}
.tag.now{background:var(--sun)}
.tag.next{border:1.5px dashed var(--mute);color:var(--mute)}
.tag.done{background:var(--blue);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border-radius:20px;padding:26px;border:1.5px solid var(--line);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:8px 8px 0 var(--blue)}
.card h3{font-size:1.2rem;margin:10px 0 6px}
.card p{color:var(--mute);font-size:.98rem}
.card.empty{border-style:dashed;background:transparent}
.card.empty:hover{box-shadow:none}
.log{--p:0;list-style:none;position:relative;padding-inline-start:46px}
.log::before,.log::after{content:"";position:absolute;inset-inline-start:13px;top:8px;width:4px;border-radius:2px}
.log::before{bottom:8px;background:var(--line)}
.log::after{background:var(--blue);height:calc((100% - 16px)*var(--p))}
.log li{position:relative;margin-bottom:30px}
.log li::before{content:"";position:absolute;inset-inline-start:-42px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--line);transition:border-color .3s,transform .3s}
.log li.on::before{border-color:var(--blue);transform:scale(1.25)}
.ver{display:inline-block;font-family:'Readex Pro',sans-serif;font-weight:700;background:var(--ink);color:#fff;font-size:.82rem;padding:1px 10px;border-radius:6px;margin-bottom:4px}
.log li.next .ver{background:var(--blue)}
.log h3{font-size:1.15rem}
.log p{color:var(--mute);font-size:.98rem}
.contact{position:relative;overflow:hidden;background:var(--ink);color:#fff;border-radius:30px;padding:56px 28px;text-align:center}
.contact::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:var(--blue);opacity:.5;filter:blur(70px);top:-140px;inset-inline-start:-80px;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(260px,60px)}}
.contact>*{position:relative}
.contact h2{margin-bottom:10px}
.contact p{color:#C3CCDD;margin-bottom:26px}
.contact .btn{background:#fff;color:var(--ink)}
footer{text-align:center;color:var(--mute);font-size:.9rem;padding:32px 0 96px}
.fab{position:fixed;bottom:18px;inset-inline-start:18px;width:58px;height:58px;border-radius:50%;background:var(--blue);display:grid;place-items:center;z-index:9;animation:pulse 2.4s infinite}
.fab svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,75,255,.55)}80%,100%{box-shadow:0 0 0 20px rgba(31,75,255,0)}}
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}
.js .rv.in{opacity:1;transform:none}
@media(max-width:760px){
.hero .wrap,.about{grid-template-columns:1fr}
.hero .wrap{gap:48px}
.hero{padding-bottom:70px}
section{padding:52px 0}
.code{inset-inline-end:-6px;min-width:190px}
.pic{margin-inline:auto}
}
@media(prefers-reduced-motion:reduce){
html{scroll-behavior:auto}
*,*::before,*::after{animation:none!important;transition:none!important}
.js .ld,.js .rv{opacity:1;transform:none}
}
</style>
</head>

const el=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang="ar";

let theme="light";
try{const th=localStorage.getItem("theme");if(th==="dark"||th==="light")theme=th;else if(matchMedia("(prefers-color-scheme: dark)").matches)theme="dark"}catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme",theme);
  const tb=$("theme-btn");
  if(tb)tb.textContent=theme==="dark"?"☀️":"🌙";
}

let io,typer;
function typeCode(){
  clearInterval(typer);
  const first=CONFIG.name.en.split(" ")[0];
  const src='const me = {\n  name: "'+first+'",\n  role: "CS Student",\n  status: "learning & building",\n  focus: "Web & Algorithms"\n};';
  const out=$("code");
  const paint=n=>{out.innerHTML=src.slice(0,n).replace(/"([^"]*)"/g,'<span class="s">"$1"</span>').replace(/"([^"]*)$/,'<span class="s">"$1</span>')};
  if(reduce){paint(src.length);return}
  let i=0;typer=setInterval(()=>{paint(++i);if(i>=src.length)clearInterval(typer)},55);
}
function render(){
  const t=T[lang],n=CONFIG.name[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=n+" | "+t.title;
  document.querySelectorAll("[data-t]").forEach(e=>{if(t[e.dataset.t])e.innerHTML=t[e.dataset.t].replace("{n}",n)});
  document.querySelectorAll("[data-name]").forEach(e=>e.textContent=n);
  document.querySelectorAll("img").forEach(i=>i.alt=n);
  $("lang").textContent=t.lang;$("fab").setAttribute("aria-label",t.fab);
  const wa="https://wa.me/"+CONFIG.phone+"?text="+encodeURIComponent(CONFIG.message[lang]);

  const inEl=$("interests");

    inEl.innerHTML="";

  }
  
  const sk=$("skills");sk.innerHTML="";
  CONFIG.skills.forEach(x=>sk.append(el(`<div class="chip rv">${x.t[lang]}<span class="tag ${x.s}">${t[x.s]}</span></div>`)));

  const jr=$("journey");jr.innerHTML="";

  const names=CONFIG.skills.map(x=>x.t.en).join("|").split("|");
  const row=names.map(x=>"<span>"+x+"</span><span>✦</span>").join("");
  $("band").innerHTML=row.repeat(4);
  observe();
}
function observe(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll(".rv").forEach(e=>{e.classList.remove("in");io.observe(e)});
}
function progress(){
  const l=$("journey"),r=l.getBoundingClientRect(),h=innerHeight;
  const p=Math.min(1,Math.max(0,(h*.65-r.top)/r.height));
  l.style.setProperty("--p",p.toFixed(3));
  l.querySelectorAll("li").forEach(li=>{
    const y=li.getBoundingClientRect().top;li.classList.toggle("on",y<h*.65)
  });
}
$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}render();progress()};
$("theme-btn").onclick=()=>{theme=theme==="dark"?"light":"dark";try{localStorage.setItem("theme",theme)}catch(e){}applyTheme()};
